const STORAGE_KEY = "bbp_cal_pwd";

async function render(keyHex) {
  const key = await crypto.subtle.importKey(
    'raw', hexToBytes(keyHex), { name: 'AES-CBC' }, false, ['decrypt']
  );
  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-CBC', iv: hexToBytes(ENCRYPTED.iv) },
    key,
    hexToBytes(ENCRYPTED.ct)
  );
  const plaintext = new TextDecoder().decode(decrypted);
  document.open();
  document.write(plaintext);
  document.close();
}

// Auto sign-on when a remembered key exists for this exact encrypted build
(async function(){
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return;
    var parts = saved.split(':');
    if (parts[0] !== SALT) { localStorage.removeItem(STORAGE_KEY); return; }
    document.getElementById('rememberMe').checked = true;
    await render(parts[1]);
  } catch(e) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
  }
})();

function toggleEye() {
  var input = document.getElementById('pwd');
  var icon = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }
}

async function signOn() {
  const password = document.getElementById('pwd').value;
  const remember = document.getElementById('rememberMe').checked;
  const keyMaterial = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: hexToBytes(SALT), iterations: ITERATIONS, hash: 'SHA-256' },
    keyMaterial,
    256
  );
  const keyHex = Array.from(new Uint8Array(bits)).map(function(b){ return b.toString(16).padStart(2, '0'); }).join('');
  try {
    await render(keyHex);
    try {
      if (remember) localStorage.setItem(STORAGE_KEY, SALT + ':' + keyHex);
      else localStorage.removeItem(STORAGE_KEY);
    } catch(e) {}
  } catch(e) {
    document.getElementById('err').style.display = 'block';
  }
}

document.getElementById('pwd').addEventListener('keydown', e => {
  if (e.key === 'Enter') signOn();
});

function hexToBytes(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2)
    bytes[i/2] = parseInt(hex.substring(i, i+2), 16);
  return bytes;
}
